<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emlak AI - Prime AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { width: 100%; max-width: 500px; background-color: #1e293b; border-radius: 16px; padding: 24px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        h1 { font-size: 32px; font-weight: bold; text-align: center; margin: 0 0 4px 0; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { font-size: 14px; color: #94a3b8; text-align: center; margin: 0 0 24px 0; }
        .input { width: 100%; background-color: #334155; color: #fff; border: none; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 16px; box-sizing: border-box; }
        .switch-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; }
        .switch-row label { color: #cbd5e1; font-size: 16px; }
        button { width: 100%; background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; border: none; padding: 16px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 12px; transition: opacity 0.2s; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .result-box { margin-top: 24px; padding: 16px; background-color: #334155; border-radius: 12px; border-left: 4px solid #a855f7; display: none; }
        .result-title { font-size: 20px; font-weight: bold; margin-bottom: 12px; }
        .result-text { font-size: 16px; color: #cbd5e1; margin-bottom: 6px; }
        .bold { font-weight: bold; color: #fff; }
        .factors-title { font-size: 16px; font-weight: bold; color: #fff; margin-top: 12px; margin-bottom: 6px; }
        .factor-item { color: #94a3b8; font-size: 14px; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Emlak AI</h1>
    <p class="subtitle">Prime AI Gelişmiş Yapay Zeka Analiz Sistemi</p>

    <input type="text" id="city" class="input" placeholder="Şehir (Örn: İstanbul)">
    <input type="text" id="district" class="input" placeholder="İlçe (Örn: Beylikdüzü)">
    <input type="number" id="sqm" class="input" placeholder="Metrekare (m²)">
    <input type="text" id="rooms" class="input" placeholder="Oda Sayısı (Örn: 3+1)">
    <input type="number" id="floor" class="input" placeholder="Bulunduğu Kat">
    <input type="number" id="building_age" class="input" placeholder="Bina Yaşı">

    <div class="switch-row">
        <label for="furnished">Eşyalı Gayrimenkul</label>
        <input type="checkbox" id="furnished" style="transform: scale(1.3);">
    </div>

    <div class="switch-row">
        <label for="in_complex">Site İçerisinde</label>
        <input type="checkbox" id="in_complex" style="transform: scale(1.3);">
    </div>

    <button id="btn" onclick="handleValuate()">Yapay Zeka İle Değerlendir</button>

    <div id="resultBox" class="result-box">
        <div class="result-title">📊 Piyasa Analiz Sonucu</div>
        <div class="result-text"><span class="bold">Tahmini Min Fiyat:</span> <span id="minPrice"></span></div>
        <div class="result-text"><span class="bold">Tahmini Max Fiyat:</span> <span id="maxPrice"></span></div>
        <div class="result-text"><span class="bold">Ortalama m² Fiyatı:</span> <span id="avgPrice"></span></div>
        <div class="factors-title">💡 Önemli Faktörler:</div>
        <div id="factorsList"></div>
    </div>
</div>

<script>
    // Sayıları noktalı formata çeviren yardımcı fonksiyon
    function formatTR(val) {
        if (!val || isNaN(Number(val))) return "Hesaplanamadı";
        return Number(val).toLocaleString('tr-TR');
    }

    async function handleValuate() {
        const city = document.getElementById('city').value;
        const district = document.getElementById('district').value;
        const sqm = document.getElementById('sqm').value;

        if (!city || !district || !sqm) {
            alert('Lütfen şehir, ilçe ve metrekare alanlarını doldurun.');
            return;
        }

        const btn = document.getElementById('btn');
        const resultBox = document.getElementById('resultBox');
        
        btn.disabled = true;
        btn.innerText = 'Analiz Ediliyor...';
        resultBox.style.display = 'none';

        const payload = {
            city: String(city),
            district: String(district),
            sqm: Number(sqm),
            rooms: String(document.getElementById('rooms').value || "2+1"),
            floor: Number(document.getElementById('floor').value || 0),
            building_age: Number(document.getElementById('building_age').value || 0),
            furnished: Boolean(document.getElementById('furnished').checked),
            in_complex: Boolean(document.getElementById('in_complex').checked)
        };

        try {
            const response = await fetch('http://localhost:8000/api/valuate', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();

            if (!response.ok) {
                alert("Backend hatası: " + (data.detail?.[0]?.msg || "Bir hata oluştu."));
                return;
            }
            
            // Çıkan ham sayıları alıyoruz
            const rawMin = data.min_price || data.minPrice || 0;
            const rawMax = data.max_price || data.maxPrice || 0;
            const rawAvg = data.avg_sqm_price || data.avgSqmPrice || data.avg_price || 0;

            // Noktalı yazdırma ve hane sayısını otomatik hesaplama aracı
            document.getElementById('minPrice').innerText = `${formatTR(rawMin)} TL (${String(rawMin).length} Haneli)`;
            document.getElementById('maxPrice').innerText = `${formatTR(rawMax)} TL (${String(rawMax).length} Haneli)`;
            document.getElementById('avgPrice').innerText = `${formatTR(rawAvg)} TL (${String(rawAvg).length} Haneli)`;
            
            const list = document.getElementById('factorsList');
            list.innerHTML = '';
            
            const factors = data.factors || data.important_factors || [];
            if (factors.length === 0) {
                list.innerHTML = '<div class="factor-item">• Analiz faktörü belirtilmedi.</div>';
            } else {
                factors.forEach(f => {
                    list.innerHTML += `<div class="factor-item">• ${f}</div>`;
                });
            }
            
            resultBox.style.display = 'block';
        } catch (error) {
            alert('Arka plan motoruna bağlanılamadı. Python sunucusunun açık olduğundan emin olun.');
        } finally {
            btn.disabled = false;
            btn.innerText = 'Yapay Zeka İle Değerlendir';
        }
    }
</script>
</body>
</html>
